name: Update Invesco ETF data

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      max_fetches:
        description: "Batch size; continue after the saved ticker cursor; empty or 0 means a full pass over every fund; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      request_sleep:
        description: "Seconds between outgoing request starts (invesco.com and Yahoo throttle; the SEC allows 10/s; keep >= 1); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      aum:
        description: "AUM min:max; bounds may be amounts or K/M/B/T suffixes, or a nano/micro/small/mid/large preset; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      ter:
        description: "Expense ratio range in %: min:max, min:, :max, or :; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      concurrency:
        description: "Parallel fund update workers (keep low); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      holdings_page_size:
        description: "Rows in each generated current-holdings JSON page; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      max_retries:
        description: "Retries after the initial request (default 2); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      tickers:
        description: "Only update these tickers, separated by spaces or commas; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      dividend_yield:
        description: "Dividend-yield percentage range; colon required; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      history_range:
        description: "Yahoo chart range for history rows (max, 10y, 5y, ...); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      prices_history:
        description: "Use the per-fund invesco.com prices & yields CSV for daily history, falling back to the Yahoo chart only when it fails or is empty (false/0 uses the Yahoo chart alone); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      edgar_fallback:
        description: "SEC EDGAR Form N-PORT-P fallback for funds without an invesco.com holdings download (default on); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      skip_yahoo:
        description: "Update invesco.com data only, keeping previous history (true/1); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      skip_invesco:
        description: "Update history only (Yahoo), keeping the previously published catalog and holdings (true/1); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      performance_ytd:
        description: "Annualized YTD return range: min:max, min:, :max, or :; colon required; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      performance_1y:
        description: "Annualized 1Y return range; colon required; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      performance_3y:
        description: "Annualized 3Y return range; colon required; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      performance_5y:
        description: "Annualized 5Y return range; colon required; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      performance_10y:
        description: "Annualized 10Y return range; colon required; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      total_return_ytd:
        description: "Cumulative YTD return range; colon required; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      total_return_1y:
        description: "Cumulative 1Y return range; colon required; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      total_return_3y:
        description: "Cumulative 3Y return range; colon required; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      total_return_5y:
        description: "Cumulative 5Y return range; colon required; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      total_return_10y:
        description: "Cumulative 10Y return range; colon required; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      advanced:
        description: 'JSON object of supported control overrides not exposed above (keys are UPPER_CASE control names, values are scalars); nonblank individual inputs win'
        required: false
        default: '{}'
        type: string

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run updater unit tests
        run: bun test
      - name: Resolve file defaults and manual overrides
        env:
          DISPATCH_INPUTS: ${{ toJSON(inputs) }}
          PROTECTED_SEC_UA: ${{ vars.SEC_UA }}
          PROTECTED_AUDIENCE_TYPE: ${{ vars.INVESCO_AUDIENCE_TYPE }}
          PROTECTED_STORE_RAW_DOWNLOADS: ${{ vars.STORE_RAW_DOWNLOADS }}
        run: |
          bun --eval '
            import { resolveControls } from "./scripts/update-data.ts";
            import { appendFile } from "node:fs/promises";
            // schedule runs have no dispatch inputs: file defaults apply as-is
            const inputs = JSON.parse(process.env.DISPATCH_INPUTS || "{}");
            const advanced = JSON.parse(inputs.advanced || "{}");
            const individual = Object.fromEntries(Object.entries(inputs)
              .filter(([key]) => key !== "advanced")
              .map(([key, value]) => [key.toUpperCase(), value]));
            const file = await Bun.file("scripts/update-data.config.json").json();
            // Protected repository Actions variables (SEC_UA, INVESCO_AUDIENCE_TYPE, STORE_RAW_DOWNLOADS): highest precedence, applied only when nonblank (never printed).
            const protectedVars = {};
            if ((process.env.PROTECTED_SEC_UA ?? "").trim()) protectedVars.SEC_UA = process.env.PROTECTED_SEC_UA.trim();
            for (const key of ["AUDIENCE_TYPE", "STORE_RAW_DOWNLOADS"]) {
              const value = (process.env[`PROTECTED_${key}`] ?? "").trim();
              if (value) protectedVars[key] = value;
            }
            const controls = resolveControls(file, advanced, individual, protectedVars);
            await appendFile(process.env.GITHUB_ENV,
              Object.entries(controls).map(([key, value]) => `${key}=${value}\n`).join(""));
          '
      - name: Generate api/invesco static data
        run: bun ./scripts/update-data.ts
      - name: Commit updated data
        if: ${{ !cancelled() }}
        run: |
          git add api/invesco
          if git diff --cached --quiet -- api/invesco; then
            echo "api/invesco is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): update Invesco ETF data"
          git push
